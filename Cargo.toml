[package]
name = "rust-media-library"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.6", features = ["desktop"] }

tokio = { version = "1", features = ["full"] }

sqlx = { version = "0.8", features = [
    "sqlite",
    "runtime-tokio",
    "migrate",
    "macros"
] }

walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

image = "0.25.x"
base64 = "0.23.1"
open = "5.4.5"
rfd = "0.18.0"


reqwest = { version = "0.12", features = ["json"] }

sha2 = "0.10"
