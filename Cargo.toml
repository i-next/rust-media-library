[package]
name = "rust-media-library"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.6", features = ["desktop"] }

tokio = { version = "1", features = ["full"] }

sqlx = { version = "0.8", features = [
    "sqlite",
    "runtime-tokio"
] }

walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"